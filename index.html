<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Web - Village, Crafting & Physical Shop</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: monospace; background: #000; }

    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 16px; height: 16px; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255, 255, 255, 0.8);
    }
    #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
    #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

    /* HUD */
    #hud {
      position: absolute; top: 15px; right: 15px;
      color: #fff; background: rgba(0, 0, 0, 0.65);
      padding: 12px 18px; border: 3px solid #555;
      font-size: 14px; z-index: 10; text-shadow: 2px 2px #000; line-height: 1.8;
    }

    #boss-container {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      width: 320px; text-align: center; color: #fff; z-index: 10; display: none; text-shadow: 2px 2px #000;
    }
    #boss-bar-bg { width: 100%; height: 14px; background: #333; border: 2px solid #fff; margin-top: 4px; }
    #boss-bar { width: 100%; height: 100%; background: #cc0000; transition: width 0.2s; }

    /* Hotbar */
    #hotbar-container {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; background: rgba(0, 0, 0, 0.6); border: 4px solid #3c3c3c;
      padding: 3px; z-index: 10; gap: 4px;
    }
    .hotbar-slot {
      width: 46px; height: 46px; border: 2px solid #222; background: #8b8b8b;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-weight: bold; font-size: 11px; text-shadow: 1px 1px #000;
    }
    .hotbar-slot.active { border-color: #ffffff; background: #a0a0a0; box-shadow: inset 0 0 5px #000; }

    /* UI Panels (Crafting & Shop) */
    .ui-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #c6c6c6; border: 4px solid #ffffff; border-right-color: #555; border-bottom-color: #555;
      padding: 20px; color: #000; z-index: 30; display: none; width: 420px;
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
    }
    .ui-header { font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 2px solid #555; padding-bottom: 5px; }
    .mc-button {
      background: #999; border: 2px solid #fff; border-right-color: #333; border-bottom-color: #333;
      padding: 10px; margin-top: 8px; cursor: pointer; font-family: monospace; font-weight: bold;
      width: 100%; text-align: right; font-size: 13px;
    }
    .mc-button:hover { background: #aaa; }
    .hint-text { font-size: 11px; color: #444; margin-top: 5px; }
  </style>
</head>
<body>

  <div id="crosshair"></div>

  <!-- HUD Status -->
  <div id="hud">
    ❤️ الدم: <span id="health-val">100</span> / 100<br>
    🍗 الجوع: <span id="hunger-val">100</span> / 100<br>
    💰 الذهب: <span id="gold-val">100</span><br>
    🪵 الخشب: <span id="wood-val">5</span> | 🪨 الحجر: <span id="stone-val">2</span><br>
    🗡️ السلاح: <span id="weapon-val">سيف خشب</span>
  </div>

  <!-- Boss Health Bar -->
  <div id="boss-container">
    <div><b>Ender Boss - الزعيــم</b></div>
    <div id="boss-bar-bg"><div id="boss-bar"></div></div>
  </div>

  <!-- Hotbar -->
  <div id="hotbar-container">
    <div class="hotbar-slot active" id="slot-1"><span>1</span><span>🗡️</span></div>
    <div class="hotbar-slot" id="slot-2"><span>2</span><span>🏹</span></div>
    <div class="hotbar-slot" id="slot-3"><span>3</span><span>🧱</span></div>
  </div>

  <!-- UI: Phone (P) -->
  <div id="ui-phone" class="ui-panel">
    <div class="ui-header">📱 هاتف المتجر السريع (P)</div>
    <button class="mc-button" onclick="buyItem('food', 15)">🍖 وجبة طعام (+30 جوع) - $15</button>
    <button class="mc-button" onclick="buyItem('health', 30)">❤️ جرعة علاج (+40 دم) - $30</button>
    <button class="mc-button" onclick="togglePhone()">إغلاق</button>
  </div>

  <!-- UI: Physical Shop (E) -->
  <div id="ui-pc" class="ui-panel">
    <div class="ui-header">🏬 كمبيوتر المتجر الرئيسي</div>
    <p>مرحباً بك داخل مبنى المتجر! اختر التجهيزات المتقدمة:</p>
    <button class="mc-button" onclick="buyItem('upgrade_gun', 100)">⚡ تطوير السلاح الخارق (+25 ضرر) - $100</button>
    <button class="mc-button" onclick="buyItem('max_health', 150)">🛡️ درع ألماس كامل (رفع الدم لـ 150) - $150</button>
    <button class="mc-button" onclick="closePC()">خروج من المتجر</button>
  </div>

  <!-- UI: Crafting Table (C) -->
  <div id="ui-crafting" class="ui-panel">
    <div class="ui-header">🔨 طاولة التصنيع (Crafting Table)</div>
    <p>اصنع أدواتك باستخدام الخشب والحجر:</p>
    <button class="mc-button" onclick="craftItem('diamond_sword')">🗡️ سيف ألماس (يحتاج: 5 خشب + 3 حجر)</button>
    <button class="mc-button" onclick="craftItem('bread')">🍞 خبز مشبع (يحتاج: 2 خشب)</button>
    <button class="mc-button" onclick="craftItem('armor')">🛡️ درع حمايه خفيف (يحتاج: 4 حجر)</button>
    <button class="mc-button" onclick="closeCrafting()">إغلاق</button>
  </div>

  <!-- Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
    // --- 1. حالة اللاعب والموارد ---
    const state = {
      gold: 100,
      wood: 5,
      stone: 2,
      health: 100,
      maxHealth: 100,
      hunger: 100,
      maxHunger: 100,
      selectedSlot: 1,
      gunDamage: 20,
      isPhoneOpen: false,
      isPCOpen: false,
      isCraftingOpen: false
    };

    // --- 2. إعداد المشهد ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec0ee);
    scene.fog = new THREE.FogExp2(0x7ec0ee, 0.012);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const sun = new THREE.DirectionalLight(0xffffff, 0.7);
    sun.position.set(30, 50, 20);
    sun.castShadow = true;
    scene.add(sun);

    const controls = new THREE.PointerLockControls(camera, document.body);
    document.body.addEventListener('click', () => {
      if (!state.isPhoneOpen && !state.isPCOpen && !state.isCraftingOpen) controls.lock();
    });

    // نقطة بداية آمنة في ساحة القرية
    camera.position.set(0, 3, 15);

    // --- 3. الأنسجة والخامات (Textures) ---
    const textureLoader = new THREE.TextureLoader();
    const grassTopTex = textureLoader.load('https://threejs.org/examples/textures/minecraft/grass.png');
    const grassSideTex = textureLoader.load('https://threejs.org/examples/textures/minecraft/grass_dirt.png');
    const dirtTex = textureLoader.load('https://threejs.org/examples/textures/minecraft/dirt.png');

    [grassTopTex, grassSideTex, dirtTex].forEach(tex => {
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
    });

    const grassMaterials = [
      new THREE.MeshLambertMaterial({ map: grassSideTex }),
      new THREE.MeshLambertMaterial({ map: grassSideTex }),
      new THREE.MeshLambertMaterial({ map: grassTopTex }),
      new THREE.MeshLambertMaterial({ map: dirtTex }),
      new THREE.MeshLambertMaterial({ map: grassSideTex }),
      new THREE.MeshLambertMaterial({ map: grassSideTex })
    ];
    const dirtMaterial = new THREE.MeshLambertMaterial({ map: dirtTex });
    const woodMaterial = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
    const stoneMaterial = new THREE.MeshLambertMaterial({ color: 0x808080 });
    const chestMaterial = new THREE.MeshLambertMaterial({ color: 0xcd853f });

    const blocks = [];
    const chests = [];
    const blockGeo = new THREE.BoxGeometry(1, 1, 1);

    // --- 4. توليد تضاريس الأرض ---
    for (let x = -20; x <= 20; x++) {
      for (let z = -20; z <= 20; z++) {
        const height = Math.floor(Math.sin(x * 0.2) + Math.cos(z * 0.2) + 1);
        for (let y = 0; y <= height; y++) {
          const cube = new THREE.Mesh(blockGeo, y === height ? grassMaterials : dirtMaterial);
          cube.position.set(x, y, z);
          scene.add(cube);
          blocks.push(cube);
        }
      }
    }

    // --- 5. بناء القرية والمنازل الجاهزة ---
    function buildHouse(startX, startZ) {
      for (let x = 0; x < 5; x++) {
        for (let z = 0; z < 5; z++) {
          for (let y = 2; y <= 5; y++) {
            // الجدران
            if (x === 0 || x === 4 || z === 0 || z === 4 || y === 5) {
              if (y === 3 && x === 2 && z === 0) continue; // باب المنزل
              const mat = (y === 5) ? woodMaterial : stoneMaterial;
              const wallBlock = new THREE.Mesh(blockGeo, mat);
              wallBlock.position.set(startX + x, y, startZ + z);
              scene.add(wallBlock);
              blocks.push(wallBlock);
            }
          }
        }
      }
      // صندوق موارد داخل المنزل
      const chest = new THREE.Mesh(blockGeo, chestMaterial);
      chest.position.set(startX + 2, 2.5, startZ + 3);
      scene.add(chest);
      chests.push(chest);
    }

    // إقامة منزلين في القرية
    buildHouse(-12, 0);
    buildHouse(8, 2);

    // --- 6. بناء مبنى المتجر الفعلي (Physical Shop) ---
    function buildShopBuilding(startX, startZ) {
      for (let x = 0; x < 6; x++) {
        for (let z = 0; z < 6; z++) {
          for (let y = 2; y <= 6; y++) {
            if (x === 0 || x === 5 || z === 0 || z === 5 || y === 6) {
              if (y === 3 && x === 3 && z === 0) continue; // الباب
              const shopWall = new THREE.Mesh(blockGeo, woodMaterial);
              shopWall.position.set(startX + x, y, startZ + z);
              scene.add(shopWall);
              blocks.push(shopWall);
            }
          }
        }
      }
    }
    buildShopBuilding(-3, -10);

    // كمبيوتر المتجر داخل المبنى
    const shopPC = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshLambertMaterial({ color: 0x111111 }));
    shopPC.position.set(0, 3, -7);
    scene.add(shopPC);

    // --- 7. طاولة التصنيع (Crafting Table) ---
    const craftingTable = new THREE.Mesh(blockGeo, new THREE.MeshLambertMaterial({ color: 0xd2b48c }));
    craftingTable.position.set(3, 2.5, 10);
    scene.add(craftingTable);

    // --- 8. سكان القرية (Villagers) ---
    const villagers = [];
    function createVillager(x, z) {
      const vGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
      const vMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
      const villager = new THREE.Mesh(vGeo, vMat);
      villager.position.set(x, 2.8, z);
      scene.add(villager);
      villagers.push(villager);
    }
    createVillager(-5, 5);
    createVillager(4, 4);

    // --- 9. الزعيم والوحوش في منطقة بعيدة ---
    const enemies = [];
    function createEnemy(x, z, isBoss = false) {
      const size = isBoss ? 2.2 : 1;
      const mat = new THREE.MeshLambertMaterial({ color: isBoss ? 0x4b0082 : 0x116611 });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size * 2, size), mat);
      mesh.position.set(x, size + 2, z);
      scene.add(mesh);

      const enemy = { mesh, isBoss, health: isBoss ? 250 : 50, maxHealth: isBoss ? 250 : 50, speed: isBoss ? 0.03 : 0.045 };
      enemies.push(enemy);
      if (isBoss) document.getElementById('boss-container').style.display = 'block';
    }
    createEnemy(-15, -18, false);
    createEnemy(0, -20, true);

    // --- 10. التفاعل والأزرار ---
    const move = { forward: false, backward: false, left: false, right: false };
    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') move.forward = true;
      if (e.code === 'KeyS') move.backward = true;
      if (e.code === 'KeyA') move.left = true;
      if (e.code === 'KeyD') move.right = true;

      if (e.code === 'Digit1') setSlot(1);
      if (e.code === 'Digit2') setSlot(2);
      if (e.code === 'Digit3') setSlot(3);

      if (e.code === 'KeyP') togglePhone();
      if (e.code === 'KeyE') {
        if (camera.position.distanceTo(shopPC.position) < 3.5) openPC();
      }
      if (e.code === 'KeyC') {
        if (camera.position.distanceTo(craftingTable.position) < 3.5) openCrafting();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') move.forward = false;
      if (e.code === 'KeyS') move.backward = false;
      if (e.code === 'KeyA') move.left = false;
      if (e.code === 'KeyD') move.right = false;
    });

    function setSlot(num) {
      state.selectedSlot = num;
      document.querySelectorAll('.hotbar-slot').forEach((el, idx) => {
        el.classList.toggle('active', idx === num - 1);
      });
      const names = { 1: 'سيف خشب', 2: 'قوس وأسهم', 3: 'كتلة طين' };
      document.getElementById('weapon-val').innerText = names[num];
    }

    // --- 11. البناء والهدم وفتح الصناديق ---
    const raycaster = new THREE.Raycaster();
    const centerMouse = new THREE.Vector2(0, 0);

    window.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('mousedown', (e) => {
      if (!controls.isLocked) return;
      raycaster.setFromCamera(centerMouse, camera);

      if (e.button === 0) { // هدم / ضرب
        // التفاعل مع الصناديق للحصول على الموارد
        const chestHits = raycaster.intersectObjects(chests);
        if (chestHits.length > 0) {
          const chestObj = chestHits[0].object;
          scene.remove(chestObj);
          chests.splice(chests.indexOf(chestObj), 1);
          state.gold += 50;
          state.wood += 5;
          state.stone += 3;
          updateHUD();
          alert('🎁 فتحت صندوق الموارد! حصلت على 50 ذهب، 5 خشب، و 3 حجر!');
          return;
        }

        // ضرب الوحوش
        const enemyHits = raycaster.intersectObjects(enemies.map(e => e.mesh));
        if (enemyHits.length > 0) {
          const target = enemies.find(e => e.mesh === enemyHits[0].object);
          if (target) {
            target.health -= state.selectedSlot === 2 ? state.gunDamage : 20;
            if (target.isBoss) {
              const pct = Math.max(0, (target.health / target.maxHealth) * 100);
              document.getElementById('boss-bar').style.width = pct + '%';
            }
            if (target.health <= 0) {
              scene.remove(target.mesh);
              state.gold += target.isBoss ? 200 : 30;
              updateHUD();
              if (target.isBoss) document.getElementById('boss-container').style.display = 'none';
              enemies.splice(enemies.indexOf(target), 1);
            }
          }
          return;
        }

        // هدم الكتل وتجميع الموارد
        const blockHits = raycaster.intersectObjects(blocks);
        if (blockHits.length > 0) {
          const hit = blockHits[0].object;
          scene.remove(hit);
          blocks.splice(blocks.indexOf(hit), 1);
          state.wood += 1;
          state.gold += 2;
          updateHUD();
        }
      } else if (e.button === 2 && state.selectedSlot === 3) { // بناء
        const blockHits = raycaster.intersectObjects(blocks);
        if (blockHits.length > 0) {
          const hit = blockHits[0];
          const newPos = hit.object.position.clone().add(hit.face.normal);
          const newCube = new THREE.Mesh(blockGeo, dirtMaterial);
          newCube.position.copy(newPos);
          scene.add(newCube);
          blocks.push(newCube);
        }
      }
    });

    // --- 12. نظام التصنيع والمتجر ---
    function togglePhone() {
      state.isPhoneOpen = !state.isPhoneOpen;
      document.getElementById('ui-phone').style.display = state.isPhoneOpen ? 'block' : 'none';
      if (state.isPhoneOpen) controls.unlock(); else controls.lock();
    }

    function openPC() {
      state.isPCOpen = true;
      document.getElementById('ui-pc').style.display = 'block';
      controls.unlock();
    }

    function closePC() {
      state.isPCOpen = false;
      document.getElementById('ui-pc').style.display = 'none';
      controls.lock();
    }

    function openCrafting() {
      state.isCraftingOpen = true;
      document.getElementById('ui-crafting').style.display = 'block';
      controls.unlock();
    }

    function closeCrafting() {
      state.isCraftingOpen = false;
      document.getElementById('ui-crafting').style.display = 'none';
      controls.lock();
    }

    function craftItem(item) {
      if (item === 'diamond_sword') {
        if (state.wood >= 5 && state.stone >= 3) {
          state.wood -= 5;
          state.stone -= 3;
          state.gunDamage += 35;
          document.getElementById('weapon-val').innerText = 'سيف ألماس خارق';
          alert('⚔️ تم صنع سيف ألماس بنجاح!');
        } else alert('الموارد غير كافية! تحتاج 5 خشب و 3 حجر.');
      } else if (item === 'bread') {
        if (state.wood >= 2) {
          state.wood -= 2;
          state.hunger = Math.min(state.maxHunger, state.hunger + 40);
          alert('🍞 تم صنع وأكل الخبز!');
        } else alert('تحتاج 2 خشب لصنع الطعام!');
      } else if (item === 'armor') {
        if (state.stone >= 4) {
          state.stone -= 4;
          state.maxHealth += 30;
          state.health += 30;
          alert('🛡️ تم صنع درع جديد وزيادة الصحة!');
        } else alert('تحتاج 4 حجر لصنع الدرع!');
      }
      updateHUD();
    }

    function buyItem(type, cost) {
      if (state.gold >= cost) {
        state.gold -= cost;
        if (type === 'food') state.hunger = Math.min(state.maxHunger, state.hunger + 30);
        if (type === 'health') state.health = Math.min(state.maxHealth, state.health + 40);
        if (type === 'upgrade_gun') state.gunDamage += 25;
        if (type === 'max_health') { state.maxHealth = 150; state.health = 150; }
        updateHUD();
        alert('تم الشراء بنجاح!');
      } else alert('الذهب غير كافٍ!');
    }

    function updateHUD() {
      document.getElementById('gold-val').innerText = state.gold;
      document.getElementById('wood-val').innerText = state.wood;
      document.getElementById('stone-val').innerText = state.stone;
      document.getElementById('health-val').innerText = Math.round(state.health);
      document.getElementById('hunger-val').innerText = Math.round(state.hunger);
    }

    // تناقص الجوع
    setInterval(() => {
      if (controls.isLocked) {
        if (state.hunger > 0) state.hunger -= 0.5;
        else state.health = Math.max(0, state.health - 2);
        updateHUD();
      }
    }, 2000);

    // حركة وحوش ودوران القرويين
    function animate() {
      requestAnimationFrame(animate);

      if (controls.isLocked) {
        if (move.forward) controls.moveForward(0.12);
        if (move.backward) controls.moveForward(-0.12);
        if (move.left) controls.moveRight(-0.12);
        if (move.right) controls.moveRight(0.12);
      }

      // تحريك القرويين ببطء
      villagers.forEach((v, index) => {
        v.rotation.y += 0.01 * (index + 1);
      });

      // مطاردة الوحوش عند الاقتراب
      enemies.forEach(enemy => {
        const dir = new THREE.Vector3().subVectors(camera.position, enemy.mesh.position);
        dir.y = 0;
        if (dir.length() < 12) {
          dir.normalize();
          enemy.mesh.position.addScaledVector(dir, enemy.speed);
          if (enemy.mesh.position.distanceTo(camera.position) < 1.6) {
            state.health = Math.max(0, state.health - (enemy.isBoss ? 0.5 : 0.2));
            updateHUD();
          }
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
